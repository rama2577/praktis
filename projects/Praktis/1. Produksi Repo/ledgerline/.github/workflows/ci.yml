name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint + Test + Build
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      AUTH_TRUST_HOST: "true"
      DATABASE_URL: postgresql://ledgerline:ledgerline@localhost:5432/ledgerline
      REDIS_URL: redis://localhost:6379
      TEST_PASSWORD: password123
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledgerline
          POSTGRES_PASSWORD: ledgerline
          POSTGRES_DB: ledgerline
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledgerline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks butuh history penuh

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true # naikkan jadi gate setelah temuan bersih
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Dependency audit (SE-06)
        run: npm run security:audit
        continue-on-error: true # naikkan jadi gate setelah daftar vuln bersih

      - name: SAST (Semgrep)
        uses: semgrep/semgrep-action@v1
        continue-on-error: true # naikkan jadi gate setelah temuan bersih
        with:
          config: p/default

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Migration + seed
        run: |
          npx prisma migrate deploy
          npx prisma db seed

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Integration (pipeline + review E2E)
        run: |
          npm run worker > /tmp/worker.log 2>&1 &
          npx next start -p 3000 > /tmp/server.log 2>&1 &
          npx wait-on http://localhost:3000/login -t 60000
          npx tsx scripts/e2e-review.ts
          npx tsx scripts/e2e-upload.ts
          npx tsx scripts/e2e-isolation.ts
          npx playwright test
